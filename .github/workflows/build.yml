name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          if [ ! -f project.zip ]; then echo "project.zip not found in repo root"; ls -la; exit 1; fi
          rm -rf _p && mkdir _p
          unzip -q project.zip -d _p
          SET=$(find _p -name settings.gradle.kts | head -1)
          if [ -z "$SET" ]; then echo "settings.gradle.kts not found inside zip"; find _p | head -50; exit 1; fi
          echo "PROJ=$(dirname "$SET")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "Signing key found: building a signed release APK"
          else
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "No signing key set: building a debug APK"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle -p "$PROJ" assembleRelease --no-daemon --stacktrace
          else
            gradle -p "$PROJ" assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJ"/app/build/outputs/apk/$BUILD_TYPE/*.apk out/DnsChanger.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DnsChanger-apk
          path: out/DnsChanger.apk
