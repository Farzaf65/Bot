name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          if [ ! -f project.zip ]; then echo "project.zip not found in repo root"; ls -la; exit 1; fi
          rm -rf _p && mkdir _p
          unzip -q project.zip -d _p
          SET=$(find _p -name settings.gradle.kts | head -1)
          if [ -z "$SET" ]; then echo "settings.gradle.kts not found inside zip"; find _p | head -50; exit 1; fi
          echo "PROJ=$(dirname "$SET")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle -p "$PROJ" assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJ"/app/build/outputs/apk/debug/*.apk out/DnsChanger.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DnsChanger-apk
          path: out/DnsChanger.apk
